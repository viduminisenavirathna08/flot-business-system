<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - 24K Shine FLOT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96 text-center">
        
        <!-- Logo Image Integration -->
        <div class="flex justify-center mb-4">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="24K Shine FLOT Logo" class="w-20 h-20 object-cover rounded-full shadow-md border-2 border-yellow-400">
        </div>

        <h2 class="text-2xl font-bold mb-6 text-gray-800">24K Shine - FLOT</h2>
        
        {% if error %}
            <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">{{ error }}</div>
        {% endif %}

        <form method="POST" class="text-left">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <input type="text" name="username" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">Login</button>
        </form>
    </div>
</body>
</html>
